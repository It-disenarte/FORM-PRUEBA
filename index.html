<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto — Disenarte</title>

<!-- ===== MEDICIÓN ===== -->

<script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #f3f2f2;
    --color-text: #201e1d;
    --color-accent: #ec3013;
    --color-accent-100: #fff2ef;
    --color-accent-300: #ffc4b8;
    --color-accent-600: #dd2b0f;
    --color-accent-700: #ae1800;
    --color-divider: color-mix(in srgb, #201e1d 40%, transparent);
    --font: "Archivo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font); }
  .wrap { min-height: 100vh; display: flex; justify-content: center; padding: 64px 24px; }
  .col { width: 100%; max-width: 640px; }
  .kicker { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 60%, transparent); margin-bottom: 12px; }
  h1 { font-family: var(--font); font-weight: 800; font-size: 40px; margin: 0 0 8px; letter-spacing: -0.015em; }
  h2 { font-family: var(--font); font-weight: 800; font-size: 24px; margin: 0 0 8px; }
  p { font-size: 15px; color: color-mix(in srgb, var(--color-text) 65%, transparent); margin: 0; }
  .hr { height: 2px; border: 0; margin: 32px 0; background: var(--color-divider); }
  form { display: flex; flex-direction: column; gap: 20px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .field label { display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
  .input {
    width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px;
    color: var(--color-text); background: transparent; border: 1px solid var(--color-divider);
    border-radius: 0; caret-color: var(--color-accent);
  }
  .input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
  .input:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 0; border-color: var(--color-accent); }
  textarea.input { min-height: 90px; resize: vertical; }
  .diag { margin-top: 40px; border: 1px dashed var(--color-divider); padding: 16px; font-size: 12px; font-family: ui-monospace, monospace; }
  .diag h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-family: var(--font); }
  .diag div { padding: 3px 0; }
  .diag .ok { color: #0a7f3f; }
  .diag .no { color: #ae1800; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  ::placeholder { color: color-mix(in srgb, var(--color-text) 40%, transparent); }
  .btn {
    display: inline-flex; align-items: center; justify-content: flex-start; text-align: left;
    width: 100%; cursor: pointer; font-family: var(--font); font-weight: 800; font-size: 14px;
    color: var(--color-bg); background: var(--color-accent); border: 0; padding: 10px 14px;
    margin-top: 8px;
  }
  .btn:hover { background: var(--color-accent-600); }
  .btn:active { background: var(--color-accent-700); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .error { font-size: 13px; color: var(--color-accent-700); border: 1px solid var(--color-accent-300); background: var(--color-accent-100); padding: 10px 14px; }
  a { color: var(--color-accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <div class="kicker">Disenarte</div>
    <h1>Contacto</h1>
    <p>Cuéntanos qué necesitas. Te respondemos en menos de 24 horas.</p>
    <hr class="hr">

    <form id="contact-form">
      <div class="row">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input class="input" id="nombre" name="nombre" type="text" required placeholder="Tu nombre">
        </div>
        <div class="field">
          <label for="empresa">Empresa</label>
          <input class="input" id="empresa" name="empresa" type="text" placeholder="Nombre de tu empresa">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" required placeholder="tu@correo.com">
        </div>
        <div class="field">
          <label for="telefono">Teléfono</label>
          <input class="input" id="telefono" name="telefono" type="tel" placeholder="55 0000 0000">
        </div>
      </div>
      <div class="field">
        <label for="asunto">Asunto</label>
        <input class="input" id="asunto" name="asunto" type="text" required placeholder="¿Sobre qué quieres hablar?">
      </div>
      <div class="field">
        <label for="mensaje">Mensaje</label>
        <textarea class="input" id="mensaje" name="mensaje" required placeholder="Escribe tu mensaje"></textarea>
      </div>
      <div class="hp" aria-hidden="true">
        <label for="sitio_web">No llenar</label>
        <input id="sitio_web" name="sitio_web" type="text" tabindex="-1" autocomplete="off">
      </div>
      <input type="hidden" name="utm_source" id="f_utm_source">
      <input type="hidden" name="utm_medium" id="f_utm_medium">
      <input type="hidden" name="utm_campaign" id="f_utm_campaign">
      <input type="hidden" name="gclid" id="f_gclid">
      <input type="hidden" name="pagina_origen" id="f_pagina_origen">
      <input type="hidden" name="ts" id="f_ts">

      <div id="form-error" class="error" style="display:none;"></div>
      <button class="btn" type="submit" id="submit-btn">Enviar mensaje</button>
    </form>

    <div class="diag" id="diag">
      <h3>Diagnóstico de medición</h3>
      <div id="d-origen">Origen: leyendo…</div>
      <div id="d-ga">GA4: esperando envío</div>
      <div id="d-ads">Google Ads: esperando envío</div>
      <div id="d-meta">Meta: esperando envío</div>
    </div>

    <div id="success" style="display:none; padding:32px 0;">
      <div class="kicker" style="color:var(--color-accent-700);">Enviado</div>
      <h2 id="success-name">Gracias.</h2>
      <p>Recibimos tu mensaje y te contactaremos pronto.</p>
    </div>
  </div>
</div>
<script>
/* ============================================================
   ⚠️ PEGA AQUÍ LA ETIQUETA de la acción de conversión
   "Formulario enviado" que crees en Google Ads.
   Es lo que va después de la diagonal en send_to.
   Ejemplo: 'AbC-D_efGhIjKl'
   ============================================================ */
const AW_ID = 'AW-16751651845';
const AW_LABEL_FORMULARIO = 'REEMPLAZAR_ETIQUETA_FORMULARIO';

const CLAVES = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','fbclid'];

function guardarOrigen() {
  try {
    const qs = new URLSearchParams(location.search);
    const datos = {};
    let hay = false;
    CLAVES.forEach(k => { const v = qs.get(k); if (v) { datos[k] = v; hay = true; } });
    if (hay) {
      datos.landing = location.pathname;
      sessionStorage.setItem('dz_origen', JSON.stringify(datos));
    }
  } catch (e) {}
}

function leerOrigen() {
  try { return JSON.parse(sessionStorage.getItem('dz_origen') || '{}'); } catch (e) { return {}; }
}

function pintar(id, texto, clase) {
  const el = document.getElementById(id);
  if (el) { el.textContent = texto; el.className = clase || ''; }
}

guardarOrigen();
const ORIGEN = leerOrigen();

document.getElementById('f_utm_source').value = ORIGEN.utm_source || '';
document.getElementById('f_utm_medium').value = ORIGEN.utm_medium || '';
document.getElementById('f_utm_campaign').value = ORIGEN.utm_campaign || '';
document.getElementById('f_gclid').value = ORIGEN.gclid || '';
document.getElementById('f_pagina_origen').value = ORIGEN.landing || location.pathname;
document.getElementById('f_ts').value = String(Date.now());

pintar('d-origen',
  (ORIGEN.utm_source || ORIGEN.gclid)
    ? 'Origen: ' + (ORIGEN.utm_campaign || ORIGEN.utm_source) + (ORIGEN.gclid ? ' · gclid presente' : '')
    : 'Origen: directo (agrega ?utm_source=prueba&utm_campaign=test&gclid=ABC123 a la URL para simular un anuncio)',
  (ORIGEN.utm_source || ORIGEN.gclid) ? 'ok' : '');

function dispararConversion() {
  gtag('event', 'generate_lead', {
    metodo: 'formulario_prueba',
    campana: ORIGEN.utm_campaign || '(directo)',
    fuente: ORIGEN.utm_source || '(directo)'
  });
  pintar('d-ga', 'GA4: generate_lead enviado ✓ (revisa Tiempo Real)', 'ok');

  fbq('track', 'Lead', { content_name: 'formulario_prueba' });
  pintar('d-meta', 'Meta: Lead enviado ✓', 'ok');

  if (AW_LABEL_FORMULARIO.indexOf('REEMPLAZAR') === 0) {
    pintar('d-ads', 'Google Ads: NO enviado — falta pegar la etiqueta de conversión', 'no');
  } else {
    gtag('event', 'conversion', { send_to: AW_ID + '/' + AW_LABEL_FORMULARIO });
    pintar('d-ads', 'Google Ads: conversión enviada ✓ ' + AW_ID + '/' + AW_LABEL_FORMULARIO, 'ok');
  }
}

  const form = document.getElementById('contact-form');
  const btn = document.getElementById('submit-btn');
  const errorBox = document.getElementById('form-error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    const data = Object.fromEntries(new FormData(form).entries());
    try {
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error('request_failed');
      dispararConversion();
      document.getElementById('success-name').textContent = `Gracias, ${data.nombre}.`;
      form.style.display = 'none';
      document.getElementById('success').style.display = 'block';
    } catch (err) {
      errorBox.textContent = 'No pudimos enviar tu mensaje. Intenta de nuevo o escríbenos directamente a it@disenartemx.com.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Enviar mensaje';
    }
  });
</script>
</body>
</html>
